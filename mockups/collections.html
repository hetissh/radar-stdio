<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RADAR — COLLECTIONS concepts</title><link rel="stylesheet" href="collections.css"></head><body>
<header><span class="left">Independent clothing &amp; culture</span><img class="logo" src="../assets/radar-logo-updated.png" alt="RADAR STUDIO"><nav><span>Collections</span><span>Search</span><span>Bag / 00</span></nav></header>
<div class="heading"><div><span class="eyebrow mono" id="direction-label"></span><h1>COLLECTIONS</h1></div><p id="intro"></p></div><main id="concept"></main><footer><span id="footer-label"></span><span>Concept only · Illustrative garments &amp; prices · Supplied reference artwork</span><span>RADAR STUDIO / 2026</span></footer>
<script>
const asset=n=>'../assets/reference-'+String(n).padStart(2,'0')+'.png';
const tee=(n,dark=false,word=false)=>`<div class="visual"><div class="tee ${dark?'dark':''}">${word?'<span class="wordmark">RADAR<br>STUDIO<br>— 001</span>':`<img src="${asset(n)}" alt="Supplied artwork on an illustrative tee">`}</div></div>`;
const piece=(name,n,price,dark=false,word=false)=>`<div class="piece">${tee(n,dark,word)}<div class="caption"><span class="name">${name}</span><span class="price">${price}</span></div></div>`;
const segment=(n,title,arrow='↗')=>`<div class="seg-head"><span class="segment-name"><span class="number">0${n} / </span>${title}</span><span class="arrow">${arrow}</span></div>`;
const sizes='<div class="sizes"><span>XS</span><span>S</span><span class="selected">M</span><span>L</span><span>XL</span></div>';
const direction=new URLSearchParams(location.search).get('direction')||'1';
const labels={1:['01 / THE LIVING CONTACT SHEET','Four streams. One open field.<br>Follow a piece. Make room for it.','Collection expands in place ↗'],2:['02 / FOUR EDITORIAL COVERS','Four ways into RADAR.<br>Choose the story you step into.','New arrivals / unfolded ↓'],3:['03 / THE FITTING SEQUENCE','Find your shape.<br>Keep what catches your eye.','Build a view. Keep browsing.']};
document.querySelector('#direction-label').textContent=labels[direction][0];document.querySelector('#intro').innerHTML=labels[direction][1];document.querySelector('#footer-label').textContent=labels[direction][2];
const contact=`<section class="contact"><div class="lane">${segment(1,'New arrivals','−')}${piece('Stillness tee / chalk',32,'₹2,400')}<div class="details"><span class="mono muted">01 / 08 · In view</span><h2>Stay a little longer.</h2><span class="mono muted">Heavy cotton · Relaxed shape</span>${sizes}<div class="cta"><span>Add to bag / ₹2,400</span><span>↗</span></div></div></div><div class="lane">${segment(2,'Best sellers')}${piece('Studio tee / washed black',0,'₹2,200',true,true)}${piece('Expression tee',33,'₹2,400')}</div><div class="lane">${segment(3,'End of season')}${piece('Fragments tee',25,'₹1,600',true)}<div class="sale"><del>₹2,600</del>Last run / −38%</div>${piece('Printed grin / archive',33,'₹1,400')}</div><div class="lane">${segment(4,'Tees')}${piece('Physical file tee',34,'₹2,400')}${piece('The icon / charcoal',23,'₹2,600',true)}</div></section>`;
const covers=`<section class="cover-grid"><article class="cover"><img src="${asset(20)}" alt="Supplied portrait reference"><span class="topline mono">01 / New arrivals</span><div class="cover-copy"><span class="mono">Fresh into the field</span><h2>The next<br>expression.</h2><span class="mono">Open collection ↓</span></div></article><article class="cover"><img src="${asset(22)}" alt="Supplied football clothing reference"><span class="topline mono">02 / Best sellers</span><div class="cover-copy"><span class="mono">Worn. Repeated. Remembered.</span><h2>On heavy<br>rotation.</h2><span class="mono">Open collection ↗</span></div></article><article class="cover"><img src="${asset(21)}" alt="Supplied football jersey reference"><span class="topline mono">03 / End of season</span><div class="cover-copy"><span class="mono">The closing chapter</span><h2>Last of<br>the run.</h2><span class="mono">Explore sale ↗</span></div></article><article class="cover"><img src="${asset(25)}" alt="Supplied collage reference"><span class="topline mono">04 / Tees</span><div class="cover-copy"><span class="mono">A surface for every signal</span><h2>Wear your<br>world.</h2><span class="mono">Explore tees ↗</span></div></article></section><section class="unfold"><div><span class="mono muted">01 / New arrivals · Open</span><h2>A fresh<br>point of view.</h2><span class="mono muted">8 pieces / View all →</span></div><div class="small-piece">${tee(32)}<div class="caption"><span class="name">Stillness tee<br><span class="muted">Chalk / 240 gsm</span></span><span class="price">₹2,400</span></div></div><div class="small-piece">${tee(0,true,true)}<div class="caption"><span class="name">Studio tee<br><span class="muted">Washed black</span></span><span class="price">₹2,200</span></div></div><div class="arrow-more">↗<p class="concept-note">The story continues<br>as you scroll.</p></div></section>`;
const fitting=`<div class="fitting-nav"><span class="selected">01 / New arrivals</span><span>02 / Best sellers</span><span>03 / End of season</span><span>04 / Tees</span></div><section class="fitting-stage"><aside class="alternatives"><span class="mono muted">Next in sequence</span><div class="selected">${tee(32)}</div><div class="caption">01 / Stillness</div>${tee(33)}<div class="caption">02 / Expression</div>${tee(34,true)}<div class="caption">03 / Physical file</div></aside><div class="hero-piece">${tee(32)}<div class="position mono"><span>← Previous</span><span>01 ━━━ 08</span><span>Next →</span></div></div><div class="product-copy"><span class="mono muted">In view / 01</span><h2>Stillness,<br>in motion.</h2><p>A print that holds your attention.<br>A relaxed silhouette that lets you move.</p><div class="price">₹2,400</div><div class="view-tabs"><span class="selected">Front</span><span class="muted">Back</span><span class="muted">Print</span><span class="muted">Fabric</span></div><span class="mono muted" style="display:block;margin-top:25px">Chalk / Heavy cotton</span>${sizes}<div class="cta"><span>Add to bag</span><span>↗</span></div><div class="keep"><span>+ Keep in view</span><span class="muted">Compare / 00</span></div></div></section><div class="sequence-line"><h3>Something caught your eye?</h3><span class="mono muted">Hold two pieces. Find your pairing. ↗</span></div>`;
document.querySelector('#concept').innerHTML=direction==='1'?contact:direction==='2'?covers:fitting;
</script></body></html>
